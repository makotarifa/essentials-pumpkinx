[package]
name = "essentials_fusion"
version = "1.0.0"
edition = "2021"
description = "Unified Pumpkin essentials: homes, warps, tpa, back, gamemode, fly, flyspeed and afk (WASM)"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Built from the exact Pumpkin tag running on the server (0.2.2+26.3-26.60).
# The API crate generates bindings for pumpkin:plugin@0.1.0 (WIT v0.1),
# which is the same iteration used by the existing PumpkinEssentials plugin.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "eda69440e6369c5f8a05c3f69fc809c40dab93a6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
