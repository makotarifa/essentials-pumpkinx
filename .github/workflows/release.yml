name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust with WASI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Unit tests (host)
        run: cargo test --lib

      - name: Check WASM target
        run: cargo check --target wasm32-wasip2

      - name: Release build
        run: cargo build --release --target wasm32-wasip2

      - name: Generate checksum
        working-directory: target/wasm32-wasip2/release
        run: sha256sum essentials_pumpkinx.wasm > essentials_pumpkinx.wasm.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/wasm32-wasip2/release/essentials_pumpkinx.wasm
            target/wasm32-wasip2/release/essentials_pumpkinx.wasm.sha256
